name: Deploy Java Application
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - run: mvn compile

  security-scan:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: table
          output: trivy-report.txt
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-cases:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - run: mvn test

  build_docker_image_and_push:
    runs-on: ubuntu-latest
    needs: test-cases
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/java-app:${{ github.sha }}

  deploy_to_kubernetes:
    runs-on: ubuntu-latest
    needs: build_docker_image_and_push
    permissions:
      id-token: write   # required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-kubectl@v3
        with:
          version: 'v1.31.0'   # match your cluster version

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::636710162452:role/github_actions
          role-session-name: gha-${{ github.run_id }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ap-south-1 --name dev-eks-cluster

      - name: Set image tag in manifest
        run: |
          sed -i "s|image: .*java-app.*|image: ${{ vars.DOCKER_USERNAME }}/java-app:${{ github.sha }}|" k8s/deployment.yaml

      - name: Deploy
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout status deployment/<your-deployment-name> --timeout=120s