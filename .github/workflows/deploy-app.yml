
name: Deploy Java Application

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compile Java Application
        run: mvn compile

  security-scan:
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: table
          output: trivy-report.txt
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-cases:
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run Test Cases
        run: mvn test

  build_docker_image_and_push:
    runs-on: ubuntu-latest
    needs: test-cases

    steps:
      - uses: actions/checkout@v7

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/java-app:${{ github.sha }}
            ${{ vars.DOCKER_USERNAME }}/java-app:latest

  deploy_to_kubernetes:
    runs-on: ubuntu-latest
    needs: build_docker_image_and_push

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ap-south-1
          role-to-assume: arn:aws:iam::636710162452:role/github_actions
          role-session-name: gha-${{ github.run_id }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name dev-eks-cluster

      - name: Deploy Kubernetes Manifest
        run: |
          kubectl apply -f k8s/deployment.yml

      - name: Update BankApp Image
        run: |
          kubectl set image deployment/bankapp \
            bankapp=${{ vars.DOCKER_USERNAME }}/java-app:${{ github.sha }}

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/bankapp --timeout=300s
          kubectl get pods
          kubectl get services
