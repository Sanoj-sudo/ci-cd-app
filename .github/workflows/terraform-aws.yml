name: Terraform EKS Infrastructure CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "Infrastructure/**"
      - ".github/workflows/terraform-aws.yml"

  push:
    branches:
      - main
    paths:
      - "Infrastructure/**"
      - ".github/workflows/terraform-aws.yml"

  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        default: apply
        options:
          - apply
          - destroy
      confirm_destroy:
        description: 'Type "yes" to confirm destroy (ignored for apply)'
        required: false
        type: string
        default: "no"

permissions:
  id-token: write
  contents: read

# Prevent simultaneous Terraform operations on the same state
concurrency:
  group: terraform-eks-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: Infrastructure/eks-infra
  TF_IN_AUTOMATION: true

jobs:

  # =========================================
  # PULL REQUEST VALIDATION
  # =========================================

  validate:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Initialize
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


  # =========================================
  # DESTROY CONFIRMATION GATE
  # Fails fast if destroy was chosen without typing "yes"
  # =========================================

  confirm-destroy:
    name: Confirm Destroy Input
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'destroy'

    steps:

      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm_destroy }}
        run: |
          if [ "$CONFIRM" != "yes" ]; then
            echo "::error::Destroy was NOT confirmed. Re-run the workflow and type 'yes' in the confirm_destroy input."
            exit 1
          fi
          echo "Destroy confirmed."


  # =========================================
  # DEPLOY INFRASTRUCTURE
  # =========================================

  deploy:
    name: Terraform Plan and Apply
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')

    # Configure required reviewers in GitHub
    environment: production

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      # AWS OIDC Authentication
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::636710162452:role/github_actions
          role-session-name: gha-${{ github.run_id }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # Initialize S3 backend
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      # Check formatting
      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      # Validate Terraform
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # Generate execution plan
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -out=tfplan

      # Apply infrastructure
      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan


  # =========================================
  # DESTROY INFRASTRUCTURE
  # Runs only on manual dispatch with action=destroy AND confirm_destroy=yes
  # =========================================

  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: confirm-destroy

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'destroy' &&
      inputs.confirm_destroy == 'yes'

    # Keeps the same required-reviewer approval as deploy.
    # Consider a separate "production-destroy" environment with stricter reviewers.
    environment: production

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::636710162452:role/github_actions
          role-session-name: gha-destroy-${{ github.run_id }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      # Show exactly what will be destroyed
      - name: Terraform Plan (Destroy)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -destroy -input=false -out=tfplan-destroy

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan-destroy