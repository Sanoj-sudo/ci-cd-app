name: Deploy Java Application
on:
    push:
        branches:
            - main
jobs:
    compile:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up JDK 17
              uses: actions/setup-java@v6
              with:
                  java-version: '17'
                  distribution: temurin
                  cache: maven

            - name: Build with Maven
              run: mvn compile

    security-scan:
        runs-on: ubuntu-latest
        needs: compile
        steps:
            - uses: actions/checkout@v7
            - name: Run Trivy vulnerability scanner in fs mode
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  scan-type: fs
                  scan-ref: '.'
                  format: 'table'
                  output: 'trivy-report.txt'
                  severity: 'CRITICAL,HIGH'
            - name: Upload Trivy report as artifact
              uses: actions/upload-artifact@v7
              with:
                  name: trivy-report
                  path: trivy-report.txt
            
            - name: gitleaks scan
              uses: gitleaks/gitleaks-action@v3
           
    test-cases:
        runs-on: ubuntu-latest
        needs: security-scan
        steps:
            - uses: actions/checkout@v7
            - name: Set up JDK 17
              uses: actions/setup-java@v6
              with:
                  java-version: '17'
                  distribution: temurin
                  cache: maven

            - name: Run JUnit tests
              run: mvn test        

    build_docker_image_and_push:
        runs-on: ubuntu-latest
        needs: test-cases
        steps:
            - uses: actions/checkout@v7
            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}
            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ secrets.DOCKER_USERNAME }}/java-app:${{ github.sha }}
    
    deploy_to_kubernetes:
        runs-on: ubuntu-latest
        needs: build_docker_image_and_push
        steps:
            - uses: actions/checkout@v7
            - name: Set up kubectl
              uses: azure/setup-kubectl@v3
              with:
                  version: 'latest'
            
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v6.3.0
              with:
                  aws-region: us-east-2
                  role-to-assume: arn:aws:iam::636710162452:role/github_actions
                  role-session-name: MySessionName
            - name: Kube config
              run: |
                  mkdir -p $HOME/.kube
                  aws eks update-kubeconfig --region us-east-2 --name eks-cluster-test
            - name: Deploy to Kubernetes
              run: |
                    kubectl apply -f k8s/deployment.yaml
                    kubectl apply -f k8s/service.yaml